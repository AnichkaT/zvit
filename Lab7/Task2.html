<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .task2 {
        display: block;
        background-color: #04AA6D; 
        padding: auto;
        width: fit-content;
        height: fit-content;
    }

    .task2 button{
        background-color: white;
        border: 5px black; 
        color: black;
        margin: 15px ;
        padding: auto;
        font-size: 18px;
    }
    .task2 input{
        background-color: white;
        border: 5px black; 
        color: black;
        margin: 15px ;
        padding: auto;
        font-size: 18px;
    }   
    </style>
</head>
<body>
    <div class="task2"> 
        <button id="swapButton">Swap me</button> 
        <input id="input1" type="text" placeholder="first value">
        <input id="input2" type="text" placeholder="second value">
    </div>

    <script>
        document.getElementById('swapButton').addEventListener('click', function() {
        const input1 = document.getElementById('input1');
        const input2 = document.getElementById('input2');

        const temp = input1.value;
        input1.value = input2.value;
        input2.value = temp;
        });
    </script>
</body>
</html>
